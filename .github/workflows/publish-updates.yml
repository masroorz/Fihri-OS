name: Publish APT repo to Pages

'on':
  push:
    branches: [main]
    paths:
      - 'apt-repo/**'
      - '.github/workflows/publish-updates.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage Pages site (apt-repo served at /apt/)
        run: |
          rm -rf site
          mkdir -p site/apt
          cp -a apt-repo/. site/apt/
          ls -R site | head -40
      - name: Upload apt-repo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
